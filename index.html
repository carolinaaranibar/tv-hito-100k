<!--
  Marketplace TV · Hito 100.000 bookings (28-10-2026, pedido de Caro)
  Celebracion a pantalla completa cuando los bookings del año cruzan 100.000. Va encima de la
  v57, que corre intacta en un iframe y vuelve sola al terminar (~42 s).

  Guion (128 BPM, compas = 1,875 s):
    0,00  Alerta    sirena de dos tonos, banda ALERTA con balizas, vineta roja que late con el pulso
    3,75  Subida    redoble y barrido de ruido; la cifra cuenta 99.900 -> 100.000 y cae justo en el drop
    7,50  Drop 1    bombo, bocinas, golpe blanco, laseres, bola de espejos, publico, gifs y confeti
   22,50  Quiebre   pads, sin bombo; los gifs se quedan, el publico se mece
   26,25  Drop 2    lo mismo con arpegio
   37,50  Salida    el filtro se cierra, los gifs salen, ultima rafaga de confeti
   41,25  Fundido   1,2 s y vuelve la v57

  Musica: sintetizada en el navegador con Web Audio (composicion original, sin licencias).
  Gifs: la bolsa de produccion, curada por el equipo (config/tv.php de marketplace-backoffice,
  CHRONOS-2086 V3), con el mismo shuffle bag (Fisher-Yates, sin repetir el ultimo al rebarajar).
  Registro de animaciones: celebracion/confetti (lluvia, cantidad adaptativa), narrativa/countup
  (variacion: cuenta los ultimos 100 hasta la meta), micro/pop (entrada de los gifs).
  Fotosensibilidad (WCAG 2.3.1, maximo 3 destellos por segundo): el estrobo blanco va cada dos pulsos
  (1,07/s) y la vineta roja de la alerta tambien (1,07/s). Nada pasa de 2 en un segundo.

  Demo: ?demo muestra los botones; tecla H celebra, M silencia, Esc corta.
  ?hito celebra al cargar; ?desde=26 arranca en ese segundo (revision).
  Produccion: window.TVHito.alCambiarTotal(total) celebra una sola vez al cruzar 100.000.
  Sonido en la TV: Chrome bloquea el audio sin un toque previo; la TV debe abrir Chrome con
  --autoplay-policy=no-user-gesture-required (o tener un toque una vez). Si no, sale el aviso.
-->

<script>
(() => {

  const T = { build: 2 * BAR, drop1: 4 * BAR, brk: 12 * BAR, drop2: 14 * BAR, outro: 20 * BAR, end: 22 * BAR };
  const FADE_OUT = 1.2;

  // Bolsa de produccion: config/tv.php de marketplace-backoffice (gifs curados por el equipo)
  const GIFS = [
    'https://media.tenor.com/JHjovctaaBIAAAAM/roblox-twerk-edit.gif',
    'https://media.tenor.com/8yqWovf1RQMAAAAM/soicodoc.gif',

    { x: 215, y: 250, r: -8 }, { x: 190, y: 575, r: 6 }, { x: 235, y: 880, r: -5 },
    { x: 1705, y: 250, r: 7 }, { x: 1730, y: 575, r: -6 }, { x: 1685, y: 880, r: 5 },
    { x: 455, y: 150, r: 5 }, { x: 1465, y: 150, r: -7 },
    { x: 530, y: 862, r: -9 }, { x: 1390, y: 862, r: 8 },
  ];

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lowMem = !!(navigator.deviceMemory && navigator.deviceMemory <= 4);
  const $ = id => document.getElementById(id);
  const hito = $('hito'), fit = $('fit'), wrap = $('wrap'), shaker = $('shaker');
  const scrim = $('scrim'), haze = $('haze'), specks = $('specks'), lasers = $('lasers'), floor = $('floor'), floorGlow = $('floorGlow');
  const backlight = $('backlight'), crowdSvg = $('crowd'), ball = $('ball'), gifsL = $('gifs'), alarm = $('alarm'), band = $('band'), bandText = $('bandText');
  const numwrap = $('numwrap'), num = $('num'), gm = $('gm'), gc = $('gc'), gb = $('gb'), word = $('word');
  const marquee = $('marquee'), conf = $('conf'), flash = $('flash'), pill = $('pill'), demo = $('demo');

  // ---------- escena ----------
  function fitStage() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    fit.style.transform = `scale(${k}) translate(-50%, -50%)`;
  }
  addEventListener('resize', fitStage); fitStage();

  $('track').textContent = 'ALERTA  ·  100.000 BOOKINGS  ·  '.repeat(10);

  const BEAMS = [];
  const LC = ['#d4ff3a', '#ff5bd8', '#38e6ff', '#b8baff', '#812df2'];
  for (const side of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const c = LC[(i + (side > 0 ? 2 : 0)) % LC.length];
      const el = document.createElement('div');
      el.className = 'beam';
      el.style.left = side < 0 ? '0px' : '1920px';
      el.style.background = `linear-gradient(90deg, ${c} 0%, ${c}cc 35%, ${c}00 100%)`;
      el.style.boxShadow = `0 0 16px 3px ${c}99`;
      lasers.appendChild(el);
      BEAMS.push({ el, side, base: 16 + i * 12, amp: 9 + i * 2.5, off: i * .7 + (side > 0 ? 1.6 : 0) });
    }
  }

  (function buildSpecks() {
    const dots = [];
    for (let i = 0; i < 150; i++) {
      const a = Math.random() * Math.PI * 2, r = 180 + Math.random() * 1250;
      const c = i % 7 === 0 ? 'rgba(56,230,255,.8)' : i % 11 === 0 ? 'rgba(255,91,216,.8)' : 'rgba(255,255,255,.75)';
      dots.push(`${(Math.cos(a) * r).toFixed(0)}px ${(Math.sin(a) * r).toFixed(0)}px 0 ${(Math.random() * 2.4).toFixed(1)}px ${c}`);
    }
    specks.style.boxShadow = dots.join(',');
  })();

  const CROWD = [];
  (function buildCrowd() {
    const NS = 'http://www.w3.org/2000/svg', N = 19;
    const ARMS = [
      'M-24 -140 L-70 -262 M24 -140 L70 -262',
      'M24 -140 L58 -272 M-26 -138 L-60 -72',
      'M-22 -140 L-40 -272 M22 -140 L40 -272',
    ];
    for (let i = 0; i < N; i++) {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('fill', '#05040a');
      g.innerHTML = `<rect x="-36" y="-158" width="72" height="190" rx="32"/><circle cx="0" cy="-186" r="27"/>` +
        `<path d="${ARMS[(i * 7) % 3]}" stroke="#05040a" stroke-width="20" stroke-linecap="round" fill="none"/>`;
      crowdSvg.appendChild(g);
      CROWD.push({ el: g, x: 50 + i * (1820 / (N - 1)) + (Math.random() * 30 - 15), s: .82 + Math.random() * .36, h: 10 + Math.random() * 14, ph: (i % 2) * .5 + Math.random() * .08 });
    }
  })();

  // ---------- audio ----------
  let ctx = null, bus = null, mFilter = null, master = null, noiseBuf = null, muted = false;
  function initAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : .9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
    bus = ctx.createGain();
    mFilter = ctx.createBiquadFilter(); mFilter.type = 'lowpass'; mFilter.frequency.value = 20000; mFilter.Q.value = .7;
    mFilter.connect(bus); bus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    ctx.addEventListener('statechange', () => { ctxOff = null; if (ctx.state === 'running') pill.style.display = 'none'; });
  }
  const out = () => mFilter;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function noise(t, dur) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    s.start(t, Math.random() * 1.5); s.stop(t + dur + .05); return s;
  }
  function filt(type, f, q = .7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

  function kick(t, v = 1) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(48, t + .12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .42);
    o.connect(g).connect(out()); o.start(t); o.stop(t + .45);
    const n = noise(t, .02), ng = ctx.createGain();
    ng.gain.setValueAtTime(.22 * v, t); ng.gain.exponentialRampToValueAtTime(.001, t + .02);
    n.connect(filt('highpass', 2500)).connect(ng).connect(out());
  }
  function clap(t, v = .55) {
    const n = noise(t, .25), g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.06, t + .01);
    g.gain.setValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.06, t + .022);
    g.gain.setValueAtTime(v, t + .024); g.gain.exponentialRampToValueAtTime(.001, t + .21);
    n.connect(filt('bandpass', 1300, .9)).connect(g).connect(out());
  }
  function hat(t, open, v) {
    const d = open ? .22 : .045, n = noise(t, d), g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    n.connect(filt('highpass', open ? 6000 : 7500)).connect(g).connect(out());
  }
  function crash(t, v = .32) {
    const n = noise(t, 2), g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.9);
    n.connect(filt('highpass', 3500)).connect(g).connect(out());
  }
  function bass(t, m, dur, v = .3) {
    const f = filt('lowpass', 1100, 6), g = ctx.createGain();
    f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(220, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006);
    g.gain.setValueAtTime(v, t + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    f.connect(g).connect(out());
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.connect(f); o.start(t); o.stop(t + dur + .02);
    const s = ctx.createOscillator(), sg = ctx.createGain(); s.type = 'sine'; s.frequency.value = mtof(m); sg.gain.value = .7;
    s.connect(sg).connect(g); s.start(t); s.stop(t + dur + .02);
  }
  function stab(t, notes, dur = .22, v = .11, cut = 3600) {
    const f = filt('lowpass', cut, 2), g = ctx.createGain();
    f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(600, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    f.connect(g).connect(out());
    for (const m of notes) for (const dt of [-9, 9]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = dt;
      o.connect(f); o.start(t); o.stop(t + dur + .02);
    }
  }
  function pad(t, notes, dur, v = .06) {
    const f = filt('lowpass', 400, 1), g = ctx.createGain();
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2600, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .4);

  function song() {

  // ---------- confeti (celebracion/confetti del registro) ----------

  function rain(n) {

  // ---------- gifs (shuffle bag como en produccion) ----------

        if (bag.length > 1 && bag[bag.length - 1] === lastGif) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      }

  }

  // ---------- guion visual ----------
  const show = (el, dur, to = 1, from = 0) => el.animate([{ opacity: from }, { opacity: to }], { duration: dur, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });

  }
  function shake() {
    if (reduce) return;

      { transform: 'translate(0,0)' }, { transform: 'translate(-14px,8px)' }, { transform: 'translate(12px,-10px)' },
      { transform: 'translate(-9px,-6px)' }, { transform: 'translate(7px,5px)' }, { transform: 'translate(-3px,2px)' }, { transform: 'translate(0,0)' },
    ], { duration: 380, easing: 'linear' });
  }
  function vAlert() {

  const CUES = [
    { t: 0, fn: vAlert }, { t: T.build, fn: vBuild }, { t: T.drop1, fn: () => vDrop(true) },
    { t: T.brk, fn: vBreak }, { t: T.drop2, fn: () => vDrop(false) }, { t: T.outro, fn: vOutro },

      gc.style.transform = `translate(calc(-50% + ${g.toFixed(1)}px), ${(-g * .3).toFixed(1)}px)`;

  function clearScene() {

  function setMuted(m) {
    muted = m;
    if (master) master.gain.setValueAtTime(m ? 0 : .9, ctx.currentTime);
    $('btnMute').textContent = m ? 'Activar sonido' : 'Silenciar';
  }

  // ---------- controles ----------
  hito.addEventListener('pointerdown', () => { if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); });
  $('btnGo').addEventListener('click', () => celebrar());
  $('btnMute').addEventListener('click', () => setMuted(!muted));
  function onKey(e) {
    const k = e.key.toLowerCase();
    if (k === 'h') celebrar();
    else if (k === 'm') setMuted(!muted);
    else if (k === 'escape') stop();
  }
  addEventListener('keydown', onKey);
  $('base').addEventListener('load', () => { try { $('base').contentWindow.addEventListener('keydown', onKey); } catch (err) {} });

  window.TVHito = {
    celebrar, stop,
    // Produccion: llamar con el total del año cada vez que cambie; celebra una sola vez
    alCambiarTotal(total) {
      const key = 'tv-hito-100k';
      let done = false;
      try { done = localStorage.getItem(key) === '1'; } catch (err) {}
      if (total >= META && !done) { try { localStorage.setItem(key, '1'); } catch (err) {} celebrar(); }
    },
    estado: () => ({ running, t: running ? +perfTime().toFixed(2) : null, audio: ctx ? ctx.state : 'sin-audio', gifs: gifsL.querySelectorAll('.st').length, confeti: conf.childElementCount }),
  };

  const q = new URLSearchParams(location.search);
  if (q.has('demo')) demo.style.display = 'flex';
  if (q.has('hito') || q.has('desde')) setTimeout(() => celebrar({ desde: q.get('desde') }), 1200);
})();
</script>
</body>
</html>
